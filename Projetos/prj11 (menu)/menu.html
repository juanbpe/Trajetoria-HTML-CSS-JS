<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Login</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="icon" type="image/x-icon" href="imgs/user.ico">
    <link rel='stylesheet' type='text/css' media='screen' href='menu.css'>
    <script src='main.js'></script>
</head>
<body>
    <div class="tela-cheia">
        <div class="login-box">
            <h2>Painel de Login</h2>
            <img src="imgs/login-avatar.ico" alt="usuário" width="30px" height="30px">
            <input type="text" id="usuario" placeholder="Usuário">
            <br><br>
            <img src="imgs/password.ico" alt="senha" width="30px" height="30px">
            <input type="password" id="senha" placeholder="Senha">
            <br><br>
            <div class="options">
                <label>
                <input type="checkbox" id="manter">Manter-me conectado
                </label>
                <a href="#" class="esqueceu-senha">Esqueceu a senha?</a>
            </div>
            <br>
            <label>
            <input type="checkbox" id="robo">Não sou um robô
            </label>
            <br><br>
            <button>Entrar</button>
    </div>
</body>
</html>
