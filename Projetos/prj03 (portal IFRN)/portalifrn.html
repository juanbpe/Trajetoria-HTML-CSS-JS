<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Início - IFRN</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='portalifrn.css'>
    <script src='main.js'></script>
    <script src="https://kit.fontawesome.com/fb71b2c7e0.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="telacheia">
        <div class="cabecalho">
            <div class="cabecalho-filho">
                <div class="cabecalho-esquerda">
                    <div class="logoifrn">
                        <img src="imgs/logoifrn.png" width="225" height="75">
                    </div>
                    <div class="nome-instituicao">
                        Educação, Ciência, Cultura e Tecnologia em <br>
                        todo o Rio Grande do Norte
                    </div>
                </div>
                <div class="cabecalho-direita">
                    <i class="fa-brands fa-instagram fa-xl" style="color: #a0a0a0;"></i>
                    <i class="fa-brands fa-x-twitter fa-xl" style="color: #a0a0a0;"></i>
                    <i class="fa-brands fa-linkedin fa-xl" style="color: #a0a0a0;"></i>
                    <i class="fa-brands fa-youtube fa-xl" style="color: #a0a0a0;"></i>
                    <i class="fa-brands fa-spotify fa-xl" style="color: #a0a0a0;"></i>
                    <i class="fa-solid fa-circle-half-stroke fa-xl" style="color: #a0a0a0;"></i>
                    <i class="fa-solid fa-moon fa-xl" style="color: #a0a0a0;"></i>
                </div>
            </div>
        </div>
        <div class="menu-container">
            <div class="menu">
                <div class="item-menu">
                    Processos Seletivos
                </div>
                <div class="item-menu">
                    Cursos
                </div>
                <div class="item-menu">
                    Campi
                </div>
                <div class="item-menu">
                    Institucional
                </div>
                <div class="item-menu">
                    Acesso à Informação
                </div>
                <div class="item-menu">
                    Eventos
                </div>
                <div class="item-menu">
                    Serviços
                </div>
            </div>
        </div>
        <div class="conteudo-container">
           <div class="noticias-destaque">
            <div class="noticia">
                <img src="imgs/noticia01.png">
            </div>
            <div class="noticia">
                <img src="imgs/noticia02.png">
            </div>
            <div class="noticia">
                <img src="imgs/noticia03.png">
            </div>
            <div class="noticia">
                <img src="imgs/noticia04.png">
            </div>
           </div>
        </div>
    </div>
