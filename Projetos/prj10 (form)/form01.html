<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='form01.css'>
    <script src='main.js'></script>
</head>
<body>
    <div class="tela-cheia">
    <form action="" method="get">
        <div>
            <div class="titulo">Cadastro de Usuário</div>
            <div>
                <label>CPF: </label>
                <input type="number" name="cpf" placeholder="Digite seu CPF"> <br>
                <br>
                <label>Nome: </label>
                <input type="text" name="nome" placeholder="Digite seu nome"> <br>
                <br>
                <label>RG: </label>
                <input type="number" name="rg" placeholder="Digite seu RG"> <br>
                <br>
                <label>Data de Nascimento:</label>
                <input type="date" name="datanascimento"> <br>
                <br>
                <label>Endereço: </label>
                <input type="text" name="endereco" placeholder="Digite seu endereço"> <br>
                <br>
                <label>Gênero:</label> <br>
                <input type="radio" name="genero" value="feminino">
                <label>Feminino</label> <br>
                <input type="radio" name="genero" value="masculino">
                <label>Masculino </label><br>
                <input type="radio" name="genero" value="nao_informado">
                <label>Prefiro não informar</label><br>
                <br>
                <label>Telefone: </label>
                <input type="number" name="telefone" placeholder="Digite seu telefone"> <br>
                <br>
                <label>E-mail: </label>
                <input type="email" name="email" placeholder="Digite seu e-mail"> <br>
                <br>
                <label>Formação Acadêmica:</label> <br>
                <input type="radio" name="formacademica" value="fundcompleto">
                <label>Ensino Fundamental Completo</label> <br>
                <input type="radio" name="formacademica" value="mediocompleto">
                <label>Ensino Médio Completo</label> <br>
                <input type="radio" name="formacademica" value="superiorcompleto">
                <label>Ensino Superior Completo</label> <br>
                <input type="radio" name="formacademica" value="posgraduacaocompleto">
                <label>Pós-Graduação Completo</label> <br>
            </div>
            <div>
                <br><br>
                <input type="submit" name="enviar" value="Enviar">
                <br><br><br>
                <div class="teste">teste</div>
            </div>
        </div>
    </form>
    </div>
</body>
</html>
